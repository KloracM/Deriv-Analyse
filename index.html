<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Analyser</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #0b1220;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 20px 10px;
    background: #17243a;
    border-radius: 12px;
}

h1 {
    color: #00d9a5;
}

.status {
    padding: 12px;
    background: #17243a;
    margin: 15px 0;
    border-radius: 8px;
    text-align: center;
}

.market {
    background: #17243a;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 10px;
    border-left: 4px solid #00d9a5;
}

.market h3 {
    margin: 0 0 12px;
}

.price {
    font-size: 24px;
    font-weight: bold;
    color: #00d9a5;
}

.change {
    font-size: 13px;
    color: #aaa;
    margin-top: 8px;
}

button {
    background: #00d9a5;
    color: #06131b;
    padding: 12px 20px;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #888;
    margin-top: 25px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>DERIV ANALYSER</h1>
    <p>Live Synthetic Indices Market Dashboard</p>
</header>

<div class="status" id="status">
    Connecting to Deriv...
</div>

<div id="markets"></div>

<footer>
    DERIV ANALYSER | LIVE MARKET DATA
    <p>Market analysis only. No automatic trading.</p>
</footer>

<script>

const APP_ID = 1089;

const symbols = [
    {name: "Volatility 10", symbol: "R_10"},
    {name: "Volatility 25", symbol: "R_25"},
    {name: "Volatility 50", symbol: "R_50"},
    {name: "Volatility 75", symbol: "R_75"},
    {name: "Volatility 100", symbol: "R_100"}
];

const prices = {};

const marketsContainer = document.getElementById("markets");

symbols.forEach(market => {

    prices[market.symbol] = {
        current: null,
        previous: null
    };

    marketsContainer.innerHTML += `
        <div class="market">
            <h3>${market.name}</h3>

            <div class="price" id="price-${market.symbol}">
                Waiting for price...
            </div>

            <div class="change" id="change-${market.symbol}">
                Awaiting market data
            </div>
        </div>
    `;

});

let socket;
let reconnectTimer;

function connectDeriv() {

    clearTimeout(reconnectTimer);

    document.getElementById("status").innerText =
        "Connecting to Deriv...";

    socket = new WebSocket(
        `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`
    );

    socket.onopen = function() {

        document.getElementById("status").innerText =
            "Connected - Receiving live prices";

        symbols.forEach(market => {

            socket.send(JSON.stringify({
                ticks: market.symbol,
                subscribe: 1
            }));

        });

    };

    socket.onmessage = function(event) {

        const data = JSON.parse(event.data);

        if (data.error) {

            document.getElementById("status").innerText =
                "API Error: " + data.error.message;

            return;
        }

        if (data.tick) {

            const symbol = data.tick.symbol;
            const quote = data.tick.quote;

            const record = prices[symbol];

            record.previous = record.current;
            record.current = quote;

            document.getElementById(
                "price-" + symbol
            ).innerText = quote;

            let movement = "Waiting for next tick";

            if (record.previous !== null) {

                if (quote > record.previous) {
                    movement = "Price moving UP";
                }

                else if (quote < record.previous) {
                    movement = "Price moving DOWN";
                }

                else {
                    movement = "Price unchanged";
                }

            }

            document.getElementById(
                "change-" + symbol
            ).innerText = movement;

        }

    };

    socket.onerror = function() {

        document.getElementById("status").innerText =
            "Connection error";

    };

    socket.onclose = function() {

        document.getElementById("status").innerText =
            "Disconnected - Reconnecting...";

        reconnectTimer = setTimeout(connectDeriv, 5000);

    };

}

connectDeriv();

</script>

</body>
</html>
